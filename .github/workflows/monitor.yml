name: Monitor parking data freshness

on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:

concurrency:
  group: parking-training-data-pipeline
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Configure rclone
        shell: bash
        env:
          GDRIVE_RCLONE_CONFIG: ${{ secrets.GDRIVE_RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$GDRIVE_RCLONE_CONFIG" > ~/.config/rclone/rclone.conf

      - name: Write freshness check script
        shell: bash
        run: |
          cat > check-freshness.py <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          threshold_minutes = 90
          now = datetime.now(timezone.utc)

          def latest(path):
              rows = json.loads(Path(path).read_text(encoding="utf-8"))
              files = [row for row in rows if row.get("Name", "").endswith(".csv")]
              if not files:
                  raise SystemExit(f"No CSV files found in {path}")
              files.sort(key=lambda row: row["ModTime"], reverse=True)
              newest = files[0]
              mod_time = datetime.fromisoformat(newest["ModTime"].replace("Z", "+00:00"))
              age_minutes = (now - mod_time).total_seconds() / 60
              print(f"{path}: {newest['Name']} updated {age_minutes:.1f} minutes ago")
              if age_minutes > threshold_minutes:
                  raise SystemExit(
                      f"{newest['Name']} is stale: {age_minutes:.1f} minutes old, "
                      f"threshold is {threshold_minutes} minutes"
                  )

          latest("monitor/roadside.json")
          latest("monitor/offstreet.json")
          PY

      - name: Check latest CSV update time
        id: freshness
        continue-on-error: true
        shell: bash
        env:
          GDRIVE_REMOTE_NAME: ${{ secrets.GDRIVE_REMOTE_NAME }}
        run: |
          set -euo pipefail
          remote="${GDRIVE_REMOTE_NAME:-gdrive}"
          mkdir -p monitor
          rclone lsjson "$remote:daily/roadside" --files-only > monitor/roadside.json
          rclone lsjson "$remote:daily/offstreet" --files-only > monitor/offstreet.json
          python check-freshness.py

      - name: Download existing daily CSV files
        if: steps.freshness.outcome == 'failure'
        env:
          GDRIVE_REMOTE_NAME: ${{ secrets.GDRIVE_REMOTE_NAME }}
        run: |
          rclone copy "${GDRIVE_REMOTE_NAME:-gdrive}:daily" data/daily --create-empty-src-dirs || true

      - name: Build collector for recovery
        if: steps.freshness.outcome == 'failure'
        run: mvn -q -DskipTests package

      - name: Collect recovery batch
        if: steps.freshness.outcome == 'failure'
        run: java -jar target/parking-data-collector-0.1.0-SNAPSHOT.jar collect

      - name: Upload recovered daily CSV files
        if: steps.freshness.outcome == 'failure'
        env:
          GDRIVE_REMOTE_NAME: ${{ secrets.GDRIVE_REMOTE_NAME }}
        run: |
          rclone copy data/daily "${GDRIVE_REMOTE_NAME:-gdrive}:daily" --create-empty-src-dirs

      - name: Re-check latest CSV update time
        if: steps.freshness.outcome == 'failure'
        shell: bash
        env:
          GDRIVE_REMOTE_NAME: ${{ secrets.GDRIVE_REMOTE_NAME }}
        run: |
          set -euo pipefail
          remote="${GDRIVE_REMOTE_NAME:-gdrive}"
          rclone lsjson "$remote:daily/roadside" --files-only > monitor/roadside.json
          rclone lsjson "$remote:daily/offstreet" --files-only > monitor/offstreet.json
          python check-freshness.py
